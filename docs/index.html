<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#2f6b4c">
<title>ruokassi</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#f4f6f0; --surface:#fbfcf8; --surface-2:#edf1e7;
    --ink:#181d16; --muted:#5a6157; --faint:#8a917f;
    --line:#dde1d5; --line-strong:#c8cebd;
    --accent:#2f6b4c; --accent-ink:#245a3f; --accent-soft:#e2efe5;
    --warn:#9c6414; --warn-soft:#f2e7d1; --danger:#a23b2f;
    --shadow:0 1px 2px rgba(24,29,22,.05), 0 8px 22px -16px rgba(24,29,22,.25);
    --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
    --sans:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
    --display:"Fraunces",Georgia,serif;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#12140f; --surface:#191c15; --surface-2:#20241b;
    --ink:#e9ece1; --muted:#9ba192; --faint:#6f7567;
    --line:#2a2e23; --line-strong:#3b4131;
    --accent:#7cba92; --accent-ink:#a7d6b6; --accent-soft:#1d2a21;
    --warn:#d7a24a; --warn-soft:#2a2416; --danger:#dd8072;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 26px -18px rgba(0,0,0,.7);
  }}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg);color:var(--ink);font-family:var(--sans);
    font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .wrap{max-width:560px;margin:0 auto;padding:0 16px 40px}
  button{font-family:inherit;cursor:pointer}

  /* header */
  header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .bar{max-width:560px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
  .brand{font-family:var(--display);font-weight:600;font-size:1.35rem;letter-spacing:-.02em;color:var(--ink);display:flex;align-items:center;gap:8px}
  .brand .dot{width:11px;height:11px;border-radius:3px;background:var(--accent)}
  .signout{background:none;border:1px solid var(--line-strong);color:var(--muted);
    border-radius:8px;padding:6px 11px;font-size:.8rem;font-family:var(--mono)}

  /* tabs */
  nav.tabs{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--line);
    border-radius:11px;padding:4px;margin:16px 0 18px}
  nav.tabs button{flex:1;border:0;background:none;color:var(--muted);font-weight:500;
    font-size:.86rem;padding:9px 4px;border-radius:8px;transition:all .12s}
  nav.tabs button[aria-selected="true"]{background:var(--surface);color:var(--accent-ink);box-shadow:var(--shadow)}

  section[hidden]{display:none}
  h2{font-family:var(--display);font-weight:600;font-size:1.15rem;letter-spacing:-.01em;margin:4px 2px 12px}

  /* stat tiles */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
  .tile{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:13px 12px;box-shadow:var(--shadow)}
  .tile .n{font-family:var(--display);font-weight:600;font-size:1.28rem;line-height:1;letter-spacing:-.02em;color:var(--accent-ink);font-variant-numeric:tabular-nums}
  .tile .k{font-family:var(--mono);font-size:.6rem;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);margin-top:8px}

  /* list rows */
  ul.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);overflow:hidden}
  ul.list li{display:flex;align-items:center;gap:12px;padding:13px 15px;border-top:1px solid var(--line)}
  ul.list li:first-child{border-top:0}
  .row-main{flex:1;min-width:0}
  .row-title{font-weight:500;font-size:.94rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row-sub{font-family:var(--mono);font-size:.72rem;color:var(--faint);margin-top:3px}
  .row-val{font-family:var(--mono);font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
  .badge{font-family:var(--mono);font-size:.64rem;padding:3px 7px;border-radius:6px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
  .badge.due{background:var(--warn-soft);color:var(--warn)}
  .badge.changed{background:var(--accent-soft);color:var(--accent-ink)}
  .qty{font-family:var(--mono);font-weight:600;color:var(--accent-ink);min-width:34px;text-align:right}

  .muted{color:var(--muted)}
  .empty{text-align:center;color:var(--muted);padding:40px 16px;font-size:.92rem}
  .empty .big{font-size:1.6rem;display:block;margin-bottom:8px}
  .hint{font-family:var(--mono);font-size:.72rem;color:var(--faint);margin:10px 2px 0}

  /* login */
  .login{max-width:400px;margin:14vh auto 0;padding:0 22px;text-align:center}
  .login .brand{justify-content:center;font-size:2rem;margin-bottom:6px}
  .login p{color:var(--muted);margin:0 0 26px}
  .login form{display:flex;flex-direction:column;gap:10px}
  .login input{font-family:inherit;font-size:1rem;padding:13px 15px;border:1px solid var(--line-strong);
    border-radius:11px;background:var(--surface);color:var(--ink)}
  .login input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
  .btn{background:var(--accent);color:#fff;border:0;border-radius:11px;padding:13px;font-size:1rem;font-weight:600}
  .btn:disabled{opacity:.55}
  .msg{margin-top:16px;font-size:.9rem;color:var(--accent-ink);min-height:1.2em}
  .msg.err{color:var(--danger)}

  .skeleton{color:var(--faint);text-align:center;padding:30px;font-family:var(--mono);font-size:.8rem}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login" class="login" hidden>
  <div class="brand"><span class="dot"></span>ruokassi</div>
  <p>Weekly food, at a glance.</p>
  <form id="loginForm">
    <input id="email" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com" required>
    <button class="btn" id="loginBtn" type="submit">Email me a login link</button>
  </form>
  <div class="msg" id="loginMsg"></div>
</div>

<!-- APP -->
<div id="app" hidden>
  <header>
    <div class="bar">
      <div class="brand"><span class="dot"></span>ruokassi</div>
      <button class="signout" id="signout">Sign out</button>
    </div>
  </header>
  <div class="wrap">
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="dash" aria-selected="true">Overview</button>
      <button role="tab" data-tab="due" aria-selected="false">Due</button>
      <button role="tab" data-tab="missing" aria-selected="false">Missing</button>
    </nav>

    <section id="dash">
      <div class="stats" id="dashStats"></div>
      <h2>Recent orders</h2>
      <ul class="list" id="ordersList"><li class="skeleton">Loading…</li></ul>
    </section>

    <section id="due" hidden>
      <h2>Due to reorder</h2>
      <ul class="list" id="dueList"><li class="skeleton">Loading…</li></ul>
      <p class="hint">Staples bought in ≥25% of orders and now past their usual interval. Suggested quantity is your median.</p>
    </section>

    <section id="missing" hidden>
      <h2>Buy at pickup</h2>
      <div id="missingWrap"><div class="skeleton">Loading…</div></div>
    </section>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SB_URL = 'https://nzpkmtwmdruqcsussxgr.supabase.co';
const SB_KEY = 'sb_publishable_E4upj6yh9azSKDx_JP2R4A_bCXyqF-A';
const sb = supabase.createClient(SB_URL, SB_KEY);

const eur = new Intl.NumberFormat('fi-FI', {style:'currency', currency:'EUR'});
const fmtDate = iso => iso ? new Date(iso+'T00:00:00').toLocaleDateString('fi-FI',{day:'numeric',month:'short'}) : '';
const $ = s => document.querySelector(s);

// ---- auth gate ----
async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  render(session);
  sb.auth.onAuthStateChange((_e, s) => render(s));
}
function render(session){
  const authed = !!session;
  $('#login').hidden = authed;
  $('#app').hidden = !authed;
  if (authed) loadAll();
}

$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const email = $('#email').value.trim();
  const btn = $('#loginBtn'), msg = $('#loginMsg');
  msg.className = 'msg'; msg.textContent = '';
  btn.disabled = true; btn.textContent = 'Sending…';
  const { error } = await sb.auth.signInWithOtp({
    email, options:{ emailRedirectTo: location.href.split('#')[0] }
  });
  btn.disabled = false; btn.textContent = 'Email me a login link';
  if (error){ msg.className='msg err'; msg.textContent = error.message; }
  else { msg.textContent = 'Check your inbox for the link ✉️'; }
});
$('#signout').addEventListener('click', () => sb.auth.signOut());

// ---- tabs ----
document.querySelectorAll('nav.tabs button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('nav.tabs button').forEach(x => x.setAttribute('aria-selected', x===b));
  ['dash','due','missing'].forEach(id => $('#'+id).hidden = (id !== b.dataset.tab));
}));

// ---- data ----
let loaded = false;
async function loadAll(){ if (loaded) return; loaded = true; loadDash(); loadDue(); loadMissing(); }

async function loadDash(){
  const { data, error } = await sb.from('orders')
    .select('order_id,order_date,receipt_type,order_total_eur,num_food_items')
    .order('order_date',{ascending:false}).limit(20);
  if (error) return fail('#ordersList', error);
  const recent = data.slice(0,8);
  const avg = recent.reduce((s,o)=>s+Number(o.order_total_eur||0),0)/(recent.length||1);
  $('#dashStats').innerHTML = tile(eur.format(data[0]?.order_total_eur||0),'last order')
    + tile(eur.format(avg),'avg (last 8)') + tile(String(data.length? data.length : 0)+'+','orders');
  $('#ordersList').innerHTML = data.map(o => `<li>
      <div class="row-main">
        <div class="row-title">${fmtDate(o.order_date)}</div>
        <div class="row-sub">${o.num_food_items} items</div>
      </div>
      ${o.receipt_type==='changed'?'<span class="badge changed">substituted</span>':''}
      <div class="row-val">${eur.format(o.order_total_eur||0)}</div>
    </li>`).join('');
}

async function loadDue(){
  const { data, error } = await sb.from('product_frequency')
    .select('product,last_ordered,days_since_last,median_days_between,median_qty,due_ratio,pct_of_orders')
    .gte('pct_of_orders',0.25).gte('due_ratio',0.8)
    .order('due_ratio',{ascending:false}).limit(60);
  if (error) return fail('#dueList', error);
  if (!data.length){ $('#dueList').outerHTML = emptyBox('#dueList','✅','Nothing due right now.'); return; }
  $('#dueList').innerHTML = data.map(p => `<li>
      <div class="row-main">
        <div class="row-title">${cap(p.product)}</div>
        <div class="row-sub">last ${fmtDate(p.last_ordered)} · every ~${Math.round(p.median_days_between)} d</div>
      </div>
      <span class="badge due">${p.days_since_last}/${Math.round(p.median_days_between)} d</span>
      <div class="qty">×${trimQty(p.median_qty)}</div>
    </li>`).join('');
}

async function loadMissing(){
  const { data, error } = await sb.from('missing_items')
    .select('product_name_raw,qty,order_id,orders(order_date)')
    .order('noted_at',{ascending:false}).limit(200);
  if (error) return fail('#missingWrap', error);
  if (!data.length){ $('#missingWrap').innerHTML = emptyHtml('🎉','No missing items on record.'); return; }
  const latest = data.reduce((m,r)=> (r.orders?.order_date>m? r.orders.order_date : m), '0000');
  const items = data.filter(r => r.orders?.order_date === latest);
  $('#missingWrap').innerHTML =
    `<p class="hint" style="margin:0 2px 12px">Out of stock in your latest order — ${fmtDate(latest)}. Grab these in store.</p>`
    + `<ul class="list">` + items.map(m => `<li>
        <div class="row-main"><div class="row-title">${cap(m.product_name_raw)}</div></div>
        <div class="qty">×${trimQty(m.qty)}</div>
      </li>`).join('') + `</ul>`;
}

// ---- helpers ----
function tile(n,k){ return `<div class="tile"><div class="n">${n}</div><div class="k">${k}</div></div>`; }
function cap(s){ s=(s||'').toLowerCase(); return s.charAt(0).toUpperCase()+s.slice(1); }
function trimQty(q){ q=Number(q); return Number.isInteger(q)? q : q.toFixed(1).replace('.',','); }
function emptyHtml(big,txt){ return `<div class="empty"><span class="big">${big}</span>${txt}</div>`; }
function emptyBox(sel,big,txt){ return `<div class="empty" id="${sel.slice(1)}"><span class="big">${big}</span>${txt}</div>`; }
function fail(sel,err){ const el=$(sel); if(el) el.innerHTML = `<li class="empty" style="color:var(--danger)">${err.message||'Could not load'}</li>`; }

boot();
</script>
</body>
</html>
